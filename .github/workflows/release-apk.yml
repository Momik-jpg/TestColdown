name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)"
          test -n "$APP_VERSION"
          if [ "$RELEASE_TAG" != "v$APP_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match app version v$APP_VERSION."
            exit 1
          fi

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          KEY_PASSWORD_EFFECTIVE="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/upload-keystore.jks
          printf "storeFile=keystore/upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD_EFFECTIVE" > keystore.properties

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Resolve APK path
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -f ".build/app/outputs/apk/release/app-release.apk" ]; then
            echo "APK_PATH=.build/app/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "APK_NAME=ExamCountdown-release-${RELEASE_TAG}.apk" >> "$GITHUB_ENV"
          elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "APK_NAME=ExamCountdown-release-${RELEASE_TAG}.apk" >> "$GITHUB_ENV"
          else
            echo "Signed release APK not found after build."
            find . -maxdepth 6 -type f -name "*.apk" -print
            exit 1
          fi

      - name: Prepare APK filename
        run: |
          mkdir -p release-artifacts
          cp "$APK_PATH" "release-artifacts/$APK_NAME"

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-artifacts/*.apk --verify-tag --generate-notes --title "Exam Countdown $RELEASE_TAG"
