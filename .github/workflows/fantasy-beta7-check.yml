name: Check Immersive Learning World Beta 8

on:
  push:
    branches: [ci/check-fantasy-beta7]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-fantasy-beta7
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verified app source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e1f4f88959623a2895073822a50878d17a5b167c
          path: project
          persist-credentials: false
      - name: Record exact source snapshot
        working-directory: project
        run: |
          git rev-parse HEAD > ../verified-source-sha.txt
          git archive --format=zip --output=../learning-world-beta8-source.zip HEAD
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: project/**/*.gradle*
      - name: Tests, lint and separate preview APK
        working-directory: project
        env:
          STUDY_UI_ARTIFACTS: ${{ github.workspace }}/artifacts/study-ui
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintPreview :app:assemblePreview --no-daemon
      - name: Verify packaged policies, license inventory and preview identity
        working-directory: project
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          apk = pathlib.Path('.build/app/outputs/apk/preview/app-preview.apk')
          with zipfile.ZipFile(apk) as archive:
              for name in ('privacy.md', 'accessibility.md', 'licenses.md'):
                  assert len(archive.read('assets/legal/' + name)) > 1000, name
              licenses = archive.read('assets/legal/licenses.md').decode()
              assert 'MIT License' in licenses and 'androidx.core:core-ktx:1.13.0' in licenses
          PY
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging .build/app/outputs/apk/preview/app-preview.apk | head -n 4
          sha256sum .build/app/outputs/apk/preview/app-preview.apk > ../preview-sha256.txt
      - name: Upload preview, native views and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: learning-world-beta8-qa
          path: |
            project/.build/app/reports/**
            project/.build/app/test-results/**
            project/.build/app/generated/legalAssets/**
            project/.build/app/outputs/apk/preview/*.apk
            artifacts/study-ui/*.png
            verified-source-sha.txt
            preview-sha256.txt
            learning-world-beta8-source.zip
          if-no-files-found: warn
