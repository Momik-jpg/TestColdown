name: Publish Android v1.6.13

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v1.6.13
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0ea3814b0660f991ba6e02ac315bb2a785767865
          persist-credentials: false

      - name: Validate release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0ea3814b0660f991ba6e02ac315bb2a785767865"
          grep -Eq '^[[:space:]]*versionCode = 22$' app/build.gradle.kts
          grep -Eq '^[[:space:]]*versionName = "1\.6\.13"$' app/build.gradle.kts
          if gh release view v1.6.13 >/dev/null 2>&1; then
            echo 'v1.6.13 already exists.'
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          KEY_PASSWORD_EFFECTIVE="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/upload-keystore.jks
          printf "storeFile=keystore/upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD_EFFECTIVE" > keystore.properties

      - name: Build signed release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Verify APK signature matches v1.6.12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_PATH=.build/app/outputs/apk/release/app-release.apk
          test -s "$APK_PATH"
          mkdir -p previous-release
          gh release download v1.6.12 --pattern '*.apk' --dir previous-release
          OLD_APK=previous-release/ExamCountdown-release-v1.6.12.apk
          test -s "$OLD_APK"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APK_SIGNER"
          OLD_CERT="$("$APK_SIGNER" verify --print-certs "$OLD_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          NEW_CERT="$("$APK_SIGNER" verify --print-certs "$APK_PATH" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$OLD_CERT"
          test "$NEW_CERT" = "$OLD_CERT"

      - name: Publish signed APK with immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp .build/app/outputs/apk/release/app-release.apk release-artifacts/ExamCountdown-release-v1.6.13.apk
          cat > release-notes.md <<'EOF'
          ## Neu in v1.6.13
          - Ruhigere, besser lesbare Prüfungsansicht mit klaren Aktionen und Filtern.
          - Bessere Bedienung auf schmalen Displays und mit grosser Schrift.
          - Verbesserte Screenreader-Überschriften und Prüfungsdetails.

          Das APK ist mit demselben Schlüssel wie v1.6.12 signiert und kann die vorhandene Installation aktualisieren.
          EOF
          gh release create v1.6.13 release-artifacts/ExamCountdown-release-v1.6.13.apk \
            --target "$(git rev-parse HEAD)" \
            --title 'Exam Countdown v1.6.13' \
            --notes-file release-notes.md
