name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Resolve APK path
        run: |
          if [ -f ".build/app/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK_PATH=.build/app/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          else
            echo "APK file not found after build."
            find . -maxdepth 6 -type f -name "*.apk" -print
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ExamCountdown-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
